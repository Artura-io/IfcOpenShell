name: Build IfcOpenShell for Python 3.14 (with cached OCCT)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Build IfcOpenShell (Linux, Python 3.14)
    runs-on: ubuntu-latest
    container:
      image: python:3.14.0-slim-trixie

    permissions:
      contents: write
      packages: write

    steps:
      - name: Install dependencies
        run: |
          pip install requests build && \
          apt update -y && \
          apt install -y git \
              cmake \
              automake \
              autoconf \
              build-essential \
              bison \
              ninja-build

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup for build script
        run: |
          cd src/ifcopenshell-python && \
          mkdir -p build && \
          cp -r ifcopenshell build/ && \
          cp ../../README.md build/ && \
          cp pyproject.toml build/

      - name: Build IfcOpenShell C++ core and Python module
        run: |
          cd nix && \
          python build-ifcopenshell.py && \
          cd ..

          # Copy compiled wrapper into Python package
          cp /usr/local/lib/python3.14/site-packages/ifcopenshell/*ifcopenshell_wrapper* src/ifcopenshell-python/build/ifcopenshell/

          # Build Python wheel
          cd src/ifcopenshell-python/build
          python -m build

      - name: Show build output
        run: ls -lh src/ifcopenshell-python/build/dist

      - name: Upload .whl to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/ifcopenshell-python/build/dist/*.whl
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
