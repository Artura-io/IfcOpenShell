name: Build IfcOpenShell for Python 3.14

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release
  PYTHON_VERSION: "3.14"

jobs:
  build-linux:
    name: Build IfcOpenShell (Linux, Python 3.14)
    runs-on: ubuntu-latest

    container:
      image: ifcopenshell/ifcopenshell-build:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip build setuptools wheel

      - name: Build IfcOpenShell wheel
        run: |
          cd src/ifcopenshell-python
          python -m build

      - name: Show build output
        run: ls -l src/ifcopenshell-python/dist

      - name: Upload .whl to release
        uses: softprops/action-gh-release@v2
        with:
          files: src/ifcopenshell-python/dist/*.whl
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
