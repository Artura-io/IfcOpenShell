name: Build OCCT 7.8.1 for Linux

on:
  workflow_dispatch:

env:
  OCCT_VERSION: 7.8.1

jobs:
  build-occt:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y tzdata
          apt-get install -y git cmake make g++ freeglut3-dev libxmu-dev libxi-dev \
            libfreetype6-dev libx11-dev libxt-dev tcl-dev tk-dev zip

      - name: Checkout OCCT sources
        run: |
          git clone --branch V${OCCT_VERSION//./_} --depth 1 https://github.com/Open-Cascade-SAS/OCCT.git /tmp/occt

      - name: Build OCCT
        run: |
          mkdir -p /tmp/occt/build
          cd /tmp/occt/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/occt \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_TKIVtk=OFF \
            -DBUILD_MODULE_TKIVtkDraw=OFF \
            -DBUILD_RELEASE_DISABLE_EXCEPTIONS=Off \
            -DUSE_FREETYPE=OFF \
            -DUSE_OPENGL=OFF \
            -DUSE_GLES2=OFF \
            -DUSE_XLIB=OFF
          make -j$(nproc)
          make install

      - name: Package OCCT
        run: |
          tar -czf /tmp/occt-${OCCT_VERSION}-linux64.tar.gz -C /usr/local occt
          ls -lh /tmp

      - name: Upload OCCT artifact
        uses: actions/upload-artifact@v4
        with:
          name: occt-${{ env.OCCT_VERSION }}-linux64
          path: /tmp/occt-${{ env.OCCT_VERSION }}-linux64.tar.gz
          retention-days: 7
